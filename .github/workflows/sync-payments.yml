name: Sync payments

on:
  schedule:
    # every 5 minutes; GitHub may delay scheduled runs by a few minutes under load
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-payments
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan for new APICreditsPurchased events on the POD Gate contract
        run: python3 scripts/sync-payments.py

      - name: Commit if a payment landed
        run: |
          if [ -n "$(git status --porcelain payments.json)" ]; then
            git config user.name 'pod-gate-bot'
            git config user.email 'pod-gate-bot@users.noreply.github.com'
            git add payments.json
            git commit -m "sync: new payment(s) from Base"
            git push
          else
            echo "no change"
          fi
